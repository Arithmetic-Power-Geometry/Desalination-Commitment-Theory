name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Tests
        run: pytest --cov=dct --cov-report=term-missing
      - name: Level 1 controlled benchmark
        run: python scripts/run_experiments.py
      - name: Level 2 base physical validation
        run: python scripts/run_physical_validation.py
      - name: Complete Level 2 physical attack
        run: python scripts/run_full_physical_attack.py
      - name: Level 3 formal HDC novelty attack
        run: python scripts/run_novelty_attack.py
      - name: Validate artifact
        run: python scripts/validate_artifact.py
      - name: Final print
        run: python scripts/final_print.py
      - name: Upload full generated artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: dct-complete-results
          path: results/
